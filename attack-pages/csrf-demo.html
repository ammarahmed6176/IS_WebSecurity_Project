
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSRF Security Demonstration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px;
        }
        .card {
            max-width: 550px;
            margin: 20px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }
        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
        .warning {
            color: #b45309;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>CSRF Demonstration</h1>
    <p>Information Security Assignment — Local Test Only</p>
    <p class="warning">
        Use fictional student accounts on localhost only.
    </p>

    <h2>Test 1: Vulnerable Version</h2>
    <p>Attempt to change the logged-in student's email.</p>

    <form method="POST"
          action="http://127.0.0.1/IS_WebSecurity_Project/vulnerable/profile.php">
        <input type="hidden" name="full_name"
               value="CSRF Demo Student">
        <input type="hidden" name="email"
               value="csrf-vulnerable@example.com">

        <button type="submit">
            Submit Vulnerable CSRF Request
        </button>
    </form>

    <hr>

    <h2>Test 2: Safe Version</h2>
    <p>Send a similar request without a CSRF token.</p>

    <form method="POST"
          action="http://127.0.0.1/IS_WebSecurity_Project/safe/profile.php">
        <input type="hidden" name="full_name"
               value="CSRF Demo Student">
        <input type="hidden" name="email"
               value="csrf-safe@example.com">

        <button type="submit">
            Submit Safe CSRF Request
        </button>
    </form>
</div>

</body>
</html>
